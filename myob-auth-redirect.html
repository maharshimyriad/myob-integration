<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>MYOB Authentication</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f5f5f5; }
        .box { background: #fff; padding: 2em 2.5em; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.12); text-align: center; max-width: 420px; }
        .spinner { width: 36px; height: 36px; border: 4px solid #ddd; border-top-color: #0073aa; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 1em; }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { color: #555; margin: 0; }
        .error { color: #c00; }
    </style>
</head>
<body>
<div class="box">
    <div class="spinner" id="spinner"></div>
    <p id="msg">Completing MYOB authentication&hellip;</p>
</div>

<script>
(function () {
    /*
     * This page is the registered OAuth redirect_uri for the MYOB API key.
     *
     * MYOB calls us with:
     *   ?code=<auth_code>&state=<url-encoded merchant MYOB-cronjob.php URL>
     *
     * We forward all query parameters to the merchant's callback URL
     * (passed via the `state` param) so that MYOB-cronjob.php can
     * complete the token exchange.
     *
     * Required query params forwarded to the merchant callback:
     *   code            – the MYOB authorisation code
     *   api_client_id   – the MYOB API client ID (defined below)
     *   api_secret      – the MYOB API secret  (defined below)
     *   api_redirect_uri – this page's URL (needed for token exchange)
     */

    // ── Config ──────────────────────────────────────────────────────────────
    // These values must match the API key registered with MYOB.
    // Update WC_MYOB_API_CLIENT_ID and the define in myob-integration.php
    // to match if you register a new key.
    var API_CLIENT_ID = '545dj2wk4r8gde2xs39mg366';
    var API_SECRET    = '';   // ← FILL IN your MYOB API secret here
    // ────────────────────────────────────────────────────────────────────────

    function getParam(name) {
        var match = new RegExp('[?&]' + name.replace(/[[\]]/g, '\\$&') + '=([^&#]*)').exec(window.location.search);
        return match ? decodeURIComponent(match[1].replace(/\+/g, ' ')) : null;
    }

    var code        = getParam('code');
    var state       = getParam('state');   // merchant's MYOB-cronjob.php URL
    var businessId  = getParam('businessId'); // optional – returned by MYOB

    var msgEl     = document.getElementById('msg');
    var spinnerEl = document.getElementById('spinner');

    if (!code || !state) {
        spinnerEl.style.display = 'none';
        msgEl.className = 'error';
        msgEl.textContent = 'Authentication failed: missing code or state parameter.';
        return;
    }

    // Build the callback URL (the merchant's MYOB-cronjob.php)
    var callbackUrl = state;

    var params = new URLSearchParams();
    params.set('code',             code);
    params.set('api_client_id',    API_CLIENT_ID);
    params.set('api_secret',       API_SECRET);
    params.set('api_redirect_uri', window.location.origin + window.location.pathname);

    if (businessId) {
        params.set('businessId', businessId);
    }

    var separator = callbackUrl.indexOf('?') === -1 ? '?' : '&';
    var target    = callbackUrl + separator + params.toString();

    // Redirect to the merchant's callback
    window.location.replace(target);
})();
</script>
</body>
</html>
