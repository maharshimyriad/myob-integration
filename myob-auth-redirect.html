<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Stars MYOB AccountRight — Authentication</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #e8edf2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,.10), 0 1px 4px rgba(0,0,0,.06);
            padding: 48px 56px 44px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        /* ── Logos ── */
        .logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 36px;
        }

        .logo-box {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 12px 18px;
            min-width: 100px;
        }

        .logo-box img {
            height: 36px;
            width: auto;
            display: block;
        }

        .logo-divider {
            font-size: 22px;
            color: #adb5bd;
            font-weight: 300;
            flex-shrink: 0;
        }

        /* ── Headings ── */
        .card h1 {
            font-size: 20px;
            font-weight: 700;
            color: #1d2327;
            margin-bottom: 10px;
            letter-spacing: -.3px;
        }

        .card p {
            font-size: 14px;
            color: #6c757d;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        /* ── Button ── */
        .btn-connect {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #2271b1;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 13px 28px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s, transform .1s, box-shadow .15s;
            text-decoration: none;
            letter-spacing: -.1px;
            box-shadow: 0 2px 6px rgba(34,113,177,.35);
        }

        .btn-connect:hover {
            background: #135e96;
            box-shadow: 0 4px 12px rgba(34,113,177,.4);
        }

        .btn-connect:active {
            transform: translateY(1px);
            box-shadow: 0 1px 4px rgba(34,113,177,.3);
        }

        .btn-connect:disabled {
            background: #90c1e8;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* ── Spinner (shown while redirecting) ── */
        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,.4);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin .65s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Result states ── */
        .result {
            display: none;
            margin-top: 24px;
            padding: 14px 18px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.5;
        }

        .result.success {
            background: #edfaef;
            color: #1a7d31;
            border: 1px solid #b8e6c0;
        }

        .result.error {
            background: #fef0f0;
            color: #c0392b;
            border: 1px solid #f5c6c6;
        }

        /* ── Footer ── */
        .footer-note {
            margin-top: 28px;
            font-size: 12px;
            color: #adb5bd;
        }
    </style>
</head>
<body>
<div class="card">

    <!-- Logos -->
    <div class="logos">
        <div class="logo-box">
            <!-- Stars logo — inline SVG wordmark -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 36" height="36" aria-label="Stars">
                <text x="0" y="27" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
                      font-size="26" font-weight="800" fill="#2271b1" letter-spacing="-1">Stars</text>
            </svg>
        </div>

        <div class="logo-divider">&#x2715;</div>

        <div class="logo-box">
            <!-- MYOB logo — inline SVG wordmark matching MYOB brand purple -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 36" height="36" aria-label="MYOB">
                <text x="0" y="27" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
                      font-size="22" font-weight="800" fill="#6b2d8b" letter-spacing="-1">MYOB</text>
            </svg>
        </div>
    </div>

    <h1>Connect to MYOB AccountRight</h1>
    <p>Your MYOB authentication was approved.<br>
       Click the button below to complete the connection and return to your store.</p>

    <button class="btn-connect" id="btn-connect" onclick="doConnect()">
        <span class="spinner" id="spinner"></span>
        <span id="btn-label">Complete Connection</span>
    </button>

    <div class="result" id="result-box"></div>

    <p class="footer-note">
        Stars MYOB AccountRight Connector &middot; Powered by MYOB OAuth 2.0
    </p>
</div>

<script>
(function () {

    // ── CONFIG ────────────────────────────────────────────────────────────
    var API_CLIENT_ID = 'YOUR_CLIENT_ID_HERE';    // ← replace
    var API_SECRET    = 'YOUR_CLIENT_SECRET_HERE'; // ← replace
    var REDIRECT_URI  = 'https://starsdev.myriadsolutionz.com/myob-auth-redirect.html';
    // ─────────────────────────────────────────────────────────────────────

    function getParam(name) {
        var match = new RegExp('[?&]' + name.replace(/[[\]]/g, '\\$&') + '=([^&#]*)').exec(window.location.search);
        return match ? decodeURIComponent(match[1].replace(/\+/g, ' ')) : null;
    }

    var code       = getParam('code');
    var state      = getParam('state');   // encoded merchant's stars-myob-cronjob.php URL
    var businessId = getParam('businessId');

    function decodeState(value) {
        if (!value || value.indexOf('cb_') !== 0) {
            return value;
        }

        var encoded = value.substring(3).replace(/-/g, '+').replace(/_/g, '/');
        while (encoded.length % 4) {
            encoded += '=';
        }

        try {
            return atob(encoded);
        } catch (e) {
            return '';
        }
    }

    var callbackUrl = decodeState(state);

    function showError(msg) {
        var btn = document.getElementById('btn-connect');
        btn.disabled = true;
        var box = document.getElementById('result-box');
        box.className = 'result error';
        box.textContent = msg;
        box.style.display = 'block';
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('btn-label').textContent = 'Complete Connection';
    }

    // Validate params on page load — disable button if something is missing
    if (!code || !callbackUrl) {
        showError(
            !code
                ? 'Authentication failed: no authorisation code received from MYOB.'
                : 'Authentication failed: missing callback URL (state parameter).'
        );
    }

    window.doConnect = function () {
        if (!code || !callbackUrl) { return; }

        var btn = document.getElementById('btn-connect');
        btn.disabled = true;
        document.getElementById('spinner').style.display = 'inline-block';
        document.getElementById('btn-label').textContent = 'Connecting\u2026';

        var params = new URLSearchParams();
        params.set('code',             code);
        params.set('api_client_id',    API_CLIENT_ID);
        params.set('api_secret',       API_SECRET);
        params.set('api_redirect_uri', REDIRECT_URI);
        if (businessId) {
            params.set('businessId', businessId);
        }

        var separator = callbackUrl.indexOf('?') === -1 ? '?' : '&';
        var target    = callbackUrl + separator + params.toString();

        // Brief pause so the button state is visible, then redirect
        setTimeout(function () {
            window.location.replace(target);
        }, 400);
    };

}());
</script>
</body>
</html>
